<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Email Generator</title>
		<link rel="stylesheet" href="options.css" />
	</head>

	<body>
		<div class="header-icon">
			<svg
				viewBox="0 0 24 24"
				xmlns="http://www.w3.org/2000/svg"
				width="48px"
				height="48px"
				style="width: 48px; height: 48px"
			>
				<g
					fill="none"
					stroke="currentColor"
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
				>
					<path d="m8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0" />
					<path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-5.5 8.28" />
				</g>
			</svg>
		</div>

		<h1>Email Generator</h1>
		<p class="subtitle">Manage your custom domains for smart email generation.</p>

		<div class="card">
			<h2>Extension Settings</h2>

			<div class="settings-row">
				<input type="checkbox" id="use-sync-toggle" />
				<label for="use-sync-toggle" class="settings-label"
					>Enable Firefox Sync (sync settings across devices)</label
				>
			</div>

			<div style="display: flex; align-items: center; gap: 8px; margin-top: 16px">
				<input type="checkbox" id="include-tld-toggle" checked />
				<label for="include-tld-toggle" style="margin: 0; cursor: pointer"
					>Include TLD in alias (netflix -> netflix.com)</label
				>
			</div>
		</div>

		<div class="card">
			<h2>Domain Configuration</h2>
			<p class="description">Add the domains you want to use for your email aliases.</p>

			<div id="saved-aliases-grid" class="saved-aliases-grid"></div>

			<div class="input-group">
				<div class="input-icon">
					<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<g
							fill="none"
							stroke="currentColor"
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
						>
							<path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0-18 0m.6-3h16.8M3.6 15h16.8" />
							<path d="m11.5 3a17 17 0 0 0 0 18m1-18a17 17 0 0 1 0 18" />
						</g>
					</svg>
				</div>
				<input
					type="text"
					id="domain-entry-field"
					placeholder="Add new domain (e.g. mydomain.com)"
					pattern="^([a-zA-Z0-9\-]+\.)+[a-zA-Z]{2,}$"
					title="Please enter a valid domain name (e.g., example.com)"
				/>
			</div>

			<div class="input-group">
				<input
					type="text"
					id="new-prefix-input"
					placeholder="Optional Prefix (e.g. junk_)"
					pattern="^[a-zA-Z0-9._+\-]*$"
					title="Only letters, numbers, periods, underscores, hyphens, and plus signs are allowed."
				/>
			</div>

			<button id="register-domain-button" class="btn-primary">
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path
						d="m12 5v14m-7-7h14"
						fill="none"
						stroke="currentColor"
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
					/>
				</svg>
				Add Domain
			</button>
			<div id="feedback-message-box" class="feedback-message-box"></div>
		</div>

		<template id="template-delete-icon">
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<path
					d="M4 7h16m-10 4v6m4-6v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"
					fill="none"
					stroke="currentColor"
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
				/>
			</svg>
		</template>

		<script type="module" src="options.js"></script>
	</body>
</html>
