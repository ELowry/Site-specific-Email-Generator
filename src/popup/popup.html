<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="../options/options.css" />
		<link rel="stylesheet" href="./popup.css" />
	</head>
	<body>
		<div class="popup-header">
			<h1>Copy Alias</h1>
			<button id="settings-btn" class="settings-btn" title="Open Settings">
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<g
						fill="none"
						stroke="currentColor"
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
					>
						<path
							d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065"
						/>
						<path d="m9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0" />
					</g>
				</svg>
			</button>
		</div>

		<div id="generated-alias-container" class="alias-list">
			<div
				id="loading-text"
				style="text-align: center; color: var(--text-subtitle); padding: 12px"
			>
				Loading...
			</div>
		</div>

		<div id="feedback-message-box" class="feedback-message-box"></div>

		<template id="template-copy-icon">
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<g
					fill="none"
					stroke="currentColor"
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
				>
					<path
						d="M7 9.667A2.667 2.667 0 0 1 9.667 7h8.666A2.667 2.667 0 0 1 21 9.667v8.666A2.667 2.667 0 0 1 18.333 21H9.667A2.667 2.667 0 0 1 7 18.333z"
					/>
					<path
						d="M4.012 16.737A2 2 0 0 1 3 15V5c0-1.1.9-2 2-2h10c.75 0 1.158.385 1.5 1"
					/>
				</g>
			</svg>
		</template>

		<template id="template-success-icon">
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<g
					fill="none"
					stroke="currentColor"
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
				>
					<path
						d="M7 9.667A2.667 2.667 0 0 1 9.667 7h8.666A2.667 2.667 0 0 1 21 9.667v8.666A2.667 2.667 0 0 1 18.333 21H9.667A2.667 2.667 0 0 1 7 18.333z"
					/>
					<path
						d="M4.012 16.737A2 2 0 0 1 3 15V5c0-1.1.9-2 2-2h10c.75 0 1.158.385 1.5 1M11 14l2 2l4-4"
					/>
				</g>
			</svg>
		</template>

		<template id="template-no-domains">
			<div style="text-align: center; padding: 16px">
				<p style="color: var(--text-subtitle); margin-bottom: 12px">
					No domains configured.
				</p>
				<button id="go-to-settings-btn" class="btn-primary">Go to Settings</button>
			</div>
		</template>

		<script type="module" src="popup.js"></script>
	</body>
</html>
