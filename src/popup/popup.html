<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="./popup.css" />
	</head>
	<body>
		<header class="popup-header">
			<div class="header-icon">
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<g
						fill="none"
						stroke="currentColor"
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
					>
						<path d="m8 12a4 4 0 1 0 8 0 4 4 0 1 0-8 0" />
						<path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-5.5 8.28" />
					</g>
				</svg>
			</div>
			<h1 data-i18n="popupHeaderTitle">Email Generator</h1>
			<button
				id="SettingsButton"
				class="btn-primary icon-only settings-btn"
				title="Open Settings"
				aria-label="Open Settings"
				data-i18n-title="popupSettingsButtonAria"
				data-i18n-aria-label="popupSettingsButtonAria"
			>
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<g
						fill="none"
						stroke="currentColor"
						stroke-linecap="round"
						stroke-linejoin="round"
						stroke-width="2"
					>
						<path
							d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065"
						/>
						<path d="m9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0" />
					</g>
				</svg>
			</button>
		</header>

		<main>
			<div id="DomainsContainer" class="alias-list" role="menu"></div>
			<div id="PopupFeedback" class="feedback-box" aria-live="polite">
				<div class="feedback-content"></div>
			</div>
		</main>

		<template id="template-copyIcon">
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<g
					fill="none"
					stroke="currentColor"
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
				>
					<path
						d="M7 9.667A2.667 2.667 0 0 1 9.667 7h8.666A2.667 2.667 0 0 1 21 9.667v8.666A2.667 2.667 0 0 1 18.333 21H9.667A2.667 2.667 0 0 1 7 18.333z"
					/>
					<path
						d="M4.012 16.737A2 2 0 0 1 3 15V5c0-1.1.9-2 2-2h10c.75 0 1.158.385 1.5 1"
					/>
				</g>
			</svg>
		</template>

		<template id="template-successIcon">
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
				<g
					fill="none"
					stroke="currentColor"
					stroke-linecap="round"
					stroke-linejoin="round"
					stroke-width="2"
				>
					<path
						d="M7 9.667A2.667 2.667 0 0 1 9.667 7h8.666A2.667 2.667 0 0 1 21 9.667v8.666A2.667 2.667 0 0 1 18.333 21H9.667A2.667 2.667 0 0 1 7 18.333z"
					/>
					<path
						d="M4.012 16.737A2 2 0 0 1 3 15V5c0-1.1.9-2 2-2h10c.75 0 1.158.385 1.5 1M11 14l2 2l4-4"
					/>
				</g>
			</svg>
		</template>

		<template id="template-missingDomains">
			<div style="text-align: center; padding: 1rem">
				<p style="opacity: 0.8; margin-bottom: 1.5rem" data-i18n="popupEmptyStateMessage">
					No domains configured.
				</p>
				<button id="OpenSettingsButton" class="btn-primary">
					<svg
						viewBox="0 0 24 24"
						xmlns="http://www.w3.org/2000/svg"
						style="width: 1.2em; height: 1.2em"
					>
						<g
							fill="none"
							stroke="currentColor"
							stroke-linecap="round"
							stroke-linejoin="round"
							stroke-width="2"
						>
							<path
								d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065"
							/>
							<path d="m9 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0" />
						</g>
					</svg>
					<span data-i18n="popupGoToSettingsButton">Go to Settings</span>
				</button>
			</div>
		</template>

		<script type="module" src="popup.js"></script>
	</body>
</html>
